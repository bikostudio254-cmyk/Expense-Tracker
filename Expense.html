<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="Expense.css">
</head>
<body>

    <h1>Expense Tracker</h1>

    <div class="summary-container">

        <div class="balance-card">
            <h3>total balance</h3>
            <h2 id="balance">ksh 0.00</h2>
        </div>

        <div class="income-card">
             <h3>Total Income</h3>
             <h2 id="income">ksh 0.00</h2>
        </div>

        <div class="expense-card">
             <h3>Total Expense</h3>
             <h2 id="expense">ksh 0.00</h2>
       </div>
    </div>

    <div class="Transaction-form">

        <h2>Add Transaction</h2>

        <input type="text" id="description" placeholder="Enter description">

        <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01">

        <select id="type">

            <option value="income">Income</option>
            <option value="expense">Expense</option>

        </select>

        <button id="add-transaction">Add Transaction</button>

    </div>

    <div class="transaction-history">

        <h2>Transaction History</h2>

        <button id="filter-All">All</button>
        <button id="filter-Income">Income</button>
        <button id="filter-Expense">Expense</button>

        <ul id="transaction-list">

        </ul>
        
    </div>


    <script src="Expense.js"></script>
    
</body>
</html>
